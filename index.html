<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a7a3d" />
  <meta name="description" content="TalentBridge Football — plataforma internacional de descubrimiento y evaluacion de talentos futbolisticos." />
  <title>TalentBridge Football</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
  <!-- Cliente Supabase Auth (solo anon key, nunca la service role) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" aria-label="TalentBridge Football inicio">
        <svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 2l2.5 5.5L20 8l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z" fill="currentColor" opacity=".85"/></svg>
        <span class="brand-name">TalentBridge<em>Football</em></span>
      </a>
      <nav class="topnav" aria-label="Principal">
        <a href="#/descubrir" data-route="descubrir">Descubrir</a>
        <a href="#/feed" data-route="feed">Feed</a>
        <a href="#/buscador" data-route="buscador">Buscador</a>
        <a href="#/scouting" data-route="scouting" class="pro-only">Scouting</a>
      </nav>
      <div class="topbar-actions">
        <button id="btn-login" class="btn btn-ghost">Ingresar</button>
        <button id="btn-logout" class="btn btn-ghost hidden">Salir</button>
        <a href="#/publicar" class="btn btn-primary">Publicar</a>
      </div>
    </div>
  </header>

  <main id="main" class="container" role="main">
    <!-- Las vistas se renderizan aqui por js/app.js -->
    <section id="view" class="view" aria-live="polite"></section>
  </main>

  <!-- Navegacion inferior (movil) -->
  <nav class="bottomnav" aria-label="Navegacion movil">
    <a href="#/" data-route="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/></svg><span>Inicio</span></a>
    <a href="#/descubrir" data-route="descubrir"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Descubrir</span></a>
    <a href="#/feed" data-route="feed"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg><span>Feed</span></a>
    <a href="#/perfil" data-route="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Perfil</span></a>
  </nav>

  <!-- Modal de autenticacion -->
  <div id="auth-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="modal-card">
      <button class="modal-close" data-close aria-label="Cerrar">&times;</button>
      <h2 id="auth-title">Ingresar / Registrarse</h2>
      <form id="auth-form" novalidate>
        <label>Email<input type="email" name="email" required autocomplete="email" placeholder="tu@email.com" /></label>
        <label>Contraseña<input type="password" name="password" required minlength="6" autocomplete="current-password" /></label>
        <p class="form-hint">El registro y login se gestionan con Supabase Auth. Los menores requieren consentimiento parental.</p>
        <div class="form-actions">
          <button type="submit" name="action" value="login" class="btn btn-primary">Ingresar</button>
          <button type="submit" name="action" value="signup" class="btn btn-outline">Crear cuenta</button>
        </div>
        <p id="auth-error" class="form-error" role="alert"></p>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/ui.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
